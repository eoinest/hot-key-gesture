appId: com.eoinest.hotkeygesture
productName: HotKey Gesture
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  - from: native/build/mouse-helper
    to: mouse-helper
mac:
  category: public.app-category.utilities
  icon: build/icon.icns
  # Local builds are unsigned and ad-hoc signed by electron-builder. The
  # hardened runtime would need a Developer ID to be useful and blocks the
  # cursor helper from launching without extra entitlements.
  identity: null
  hardenedRuntime: false
  extendInfo:
    NSCameraUsageDescription: HotKey Gesture uses your camera to recognize hand gestures. Video never leaves your device.
    NSAppleEventsUsageDescription: HotKey Gesture sends keystrokes via System Events when a gesture triggers a shortcut.
    NSCameraUseContinuityCameraDeviceType: true
  target:
    - target: dir
      arch: arm64
win:
  target:
    - nsis
linux:
  target:
    - AppImage
  category: Utility
